name = "horas-sync"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
DISABLE_ENCRYPTION_ACTIVATION = "true"
# Lista separada por comas. En desarrollo se agregan http://127.0.0.1:5180 y http://localhost:5173.
ALLOWED_ORIGIN = "https://ilancueto.github.io"

# SYNC_KEY es un secreto: `wrangler secret put SYNC_KEY` (nunca en este archivo).

[[d1_databases]]
binding = "DB"
database_name = "horas"
database_id = "1268b244-a31f-45ac-aa5f-2dc870ae4248"
